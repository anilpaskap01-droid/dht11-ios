name: Build AutoMirror APKs

on:
  push:
    branches: [ "automirror-apk-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APKs
        working-directory: automirror
        run: gradle :sender:assembleDebug :headunit:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AutoMirror-APKs
          path: |
            automirror/sender/build/outputs/apk/debug/sender-debug.apk
            automirror/headunit/build/outputs/apk/debug/headunit-debug.apk
